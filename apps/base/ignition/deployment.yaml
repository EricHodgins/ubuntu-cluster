apiVersion: apps/v1
kind: Deployment
metadata:
  name: ignition
  namespace: ignition

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ignition

  template:
    metadata:
      labels:
        app: ignition

    spec:
      initContainers:
        - name: init-ignition-data
          image: inductiveautomation/ignition:8.3.0
          command:
            - sh
            - -c
            - |
              # Only initialize PVC once
              if [ ! -f /data/.initialized ]; then
                cp -r /usr/local/bin/ignition/data/* /data/
                touch /data/.initialized
              fi
          volumeMounts:
            - name: ignition-data
              mountPath: /data

      containers:
        - name: ignition
          image: inductiveautomation/ignition:8.3.0

          ports:
            - containerPort: 8088

          envFrom:
            - secretRef:
                name: ignition-container-env

          volumeMounts:
            - name: ignition-data
              mountPath: /usr/local/bin/ignition/data

      volumes:
        - name: ignition-data
          persistentVolumeClaim:
            claimName: ignition-data-pvc

