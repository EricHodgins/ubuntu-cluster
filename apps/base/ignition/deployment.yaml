apiVersion: apps/v1
kind: Deployment
metadata:
  name: ignition
  namespace: ignition
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ignition
  template:
    metadata:
      labels:
        app: ignition
    spec:
      initContainers:
        - name: copy-ignition-defaults
          image: inductiveautomation/ignition:8.1.42
          command:
            - sh
            - -c
            - |
              if [ -z "$(ls -A /data)" ]; then
                cp -r /usr/local/bin/ignition/* /data/
              fi
          volumeMounts:
            - name: ignition-data
              mountPath: /data

      containers:
        - name: ignition
          image: inductiveautomation/ignition:8.1.42
          ports:
            - containerPort: 8088

          envFrom:
            - secretRef:
                name: ignition-container-env

          volumeMounts:
            # 🔥 THIS IS THE CRITICAL FIX
            - name: ignition-data
              mountPath: /data

      volumes:
        - name: ignition-data
          persistentVolumeClaim:
            claimName: ignition-data-pvc
