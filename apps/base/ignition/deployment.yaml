apiVersion: apps/v1
kind: Deployment
metadata:
  name: ignition
  namespace: ignition

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ignition

  template:
    metadata:
      labels:
        app: ignition

    spec:
      initContainers:
        - name: init-ignition-data
          image: inductiveautomation/ignition:8.3.3
          command:
            - sh
            - -c
            - |
              # Only initialize PVC once
              if [ ! -f /data/.initialized ]; then
                cp -r /usr/local/bin/ignition/data/* /data/
                touch /data/.initialized
              fi
          volumeMounts:
            - name: ignition-data
              mountPath: /data

      containers:
        - name: ignition
          image: inductiveautomation/ignition:8.3.3
          args:
            - "-n"
            - "ignition"
            - "--"
            - "wrapper.java.maxmemory=4096"
            - "wrapper.java.initmemory=1024"          

          ports:
            - containerPort: 8088

          envFrom:
            - secretRef:
                name: ignition-container-env

          volumeMounts:
            - name: ignition-data
              mountPath: /usr/local/bin/ignition/data
            - name: precisionpac
              mountPath: /usr/local/bin/ignition/data/config/resources/core/com.inductiveautomation.perspective/themes/precisionpac
            - name: precisionpac-light
              mountPath: /usr/local/bin/ignition/data/config/resources/core/com.inductiveautomation.perspective/themes/precisionpac-light

      volumes:
        - name: ignition-data
          persistentVolumeClaim:
            claimName: ignition-data-pvc
        - name: precisionpac
          configMap:
            name: ignition-theme-precisionpac
        - name: precisionpac-light
          configMap:
            name: ignition-theme-precisionpac-light