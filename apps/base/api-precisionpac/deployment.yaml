apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-precisionpac  

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-precisionpac

  template:

    metadata:
      labels:
        app: api-precisionpac

      
    spec:
      imagePullSecrets:
        - name: artifact-registry

      containers:
      
        - name: api-precisionpac

          image: northamerica-northeast2-docker.pkg.dev/aqueous-cabinet-203817/api-precisionpac/api-precisionpac:0.2.0                 
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: api-precisionpac-config

            - secretRef:
                name: api-precisionpac-secrets

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"